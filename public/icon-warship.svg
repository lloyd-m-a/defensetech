<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none">
  <g fill="#0F2440">

    <!-- Hull -->
    <path d="
      M 60 305
      L 130 238
      L 1090 238
      Q 1120 255 1135 295
      Q 980 332 600 338
      Q 240 332 60 305
      Z
    "/>

    <!-- Forward gun platform -->
    <rect x="175" y="218" width="90" height="20" rx="2"/>
    <!-- Gun barrel -->
    <rect x="260" y="221" width="90" height="10" rx="3"/>
    <!-- Gun turret base -->
    <ellipse cx="210" cy="218" rx="38" ry="12"/>

    <!-- Main superstructure (long base block) -->
    <rect x="360" y="188" width="380" height="50" rx="2"/>

    <!-- Bridge tower -->
    <rect x="430" y="148" width="160" height="40" rx="2"/>

    <!-- Bridge top level -->
    <rect x="460" y="118" width="105" height="30" rx="2"/>

    <!-- Mast base -->
    <rect x="506" y="68" width="8" height="50"/>
    <!-- Mast crossbar top -->
    <rect x="482" y="74" width="56" height="5" rx="1"/>
    <!-- Mast crossbar mid -->
    <rect x="490" y="90" width="40" height="4" rx="1"/>
    <!-- Radar dome -->
    <ellipse cx="510" cy="66" rx="14" ry="10"/>

    <!-- Funnel / stack -->
    <rect x="630" y="158" width="36" height="32" rx="3"/>
    <rect x="634" y="148" width="28" height="12" rx="2"/>

    <!-- Rear superstructure -->
    <rect x="720" y="195" width="240" height="43" rx="2"/>
    <rect x="760" y="162" width="140" height="33" rx="2"/>
    <rect x="800" y="138" width="80" height="24" rx="2"/>

    <!-- Rear mast -->
    <rect x="837" y="88" width="7" height="50"/>
    <rect x="816" y="95" width="49" height="4" rx="1"/>
    <!-- Rear radar -->
    <ellipse cx="840" cy="86" rx="12" ry="9"/>

    <!-- Helicopter deck (stern) -->
    <rect x="980" y="220" width="100" height="18" rx="1"/>

    <!-- Waterline detail -->
    <rect x="60" y="295" width="1075" height="6" rx="2" fill-opacity="0.3"/>

  </g>
</svg>
